# Generic single-role XL1 node.
#
# Two services, matching the image's two entrypoint modes:
#
#   node    passthrough — you supply the full config via env / CLI args.
#   preset  XL1_NETWORK + XL1_ROLE — the entrypoint builds the config itself.
#           This is the only way to run a federated producer against a public
#           network: provider bindings cannot be expressed as env vars, so an
#           env-only producer always forks its own chain.
#
# Passthrough (default service):
#   export XL1_IMAGE=xl1:local
#   docker compose -f compose/node.yml --env-file examples/env/api.env.example \
#     run --service-ports --rm node start api
#
#   docker compose -f compose/node.yml run --rm -e XL1_ACTORS__0__NAME=producer node start producer
#
# Preset (Sequence producer):
#   cp examples/env/sequence-producer.env.example sequence-producer.env   # fill in the secrets
#   export XL1_IMAGE=xl1:local XL1_PRESET_ENV_FILE=../sequence-producer.env
#   docker compose -f compose/node.yml --profile preset up -d preset
#
# Name the service: `node` carries no profile, so a bare `up` would start it too
# and both services publish the same health port.

name: xl1-node

services:
  node:
    image: ${XL1_IMAGE:-ghcr.io/xyoraclenetwork/xl1:latest}
    pull_policy: ${XL1_PULL_POLICY:-missing}
    restart: unless-stopped
    env_file:
      - ${XL1_ENV_FILE:-../examples/env/api.env.example}
    environment:
      XL1_HEALTH_CHECK_PORT: ${XL1_HEALTH_CHECK_PORT:-9099}
      # LMDB / local store under the data volume
      XL1_CONNECTIONS__LOCAL_STORE__TYPE: ${XL1_CONNECTIONS__LOCAL_STORE__TYPE:-lmdb}
      XL1_CONNECTIONS__LOCAL_STORE__ROOT: ${XL1_CONNECTIONS__LOCAL_STORE__ROOT:-/data/.store}
    volumes:
      - xl1_data:/data
    ports:
      - "${XL1_HOST_PORT:-8080}:${XL1_CONTAINER_PORT:-8080}"
      - "${XL1_HEALTH_HOST_PORT:-9099}:${XL1_HEALTH_CHECK_PORT:-9099}"
    # Default: api. Override: XL1_START_ACTORS="producer" or compose run ... start producer
    command: ["start", "${XL1_START_ACTORS:-api}"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${XL1_HEALTH_CHECK_PORT:-9099}/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Preset mode. No `command:` — the entrypoint derives `start <actors…>` from
  # XL1_NETWORK/XL1_ROLE and appends any argv after it, so a command here would
  # produce `start producer start producer`.
  #
  # No local-store env and no volume either: a federated producer keeps block
  # state in memory and submits via JsonRpc mempool. XL1_ROLE=producer reads the
  # chain over RPC; producer-rest reads it from the REST CDNs. Declaring an lmdb
  # store would rebind the viewers to that store and fork a private chain.
  preset:
    profiles: ["preset"]
    image: ${XL1_IMAGE:-ghcr.io/xyoraclenetwork/xl1:latest}
    pull_policy: ${XL1_PULL_POLICY:-missing}
    restart: unless-stopped
    env_file:
      - ${XL1_PRESET_ENV_FILE:-../examples/env/sequence-producer.env.example}
    environment:
      XL1_HEALTH_CHECK_PORT: ${XL1_HEALTH_CHECK_PORT:-9099}
    command: []
    ports:
      - "${XL1_HEALTH_HOST_PORT:-9099}:${XL1_HEALTH_CHECK_PORT:-9099}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${XL1_HEALTH_CHECK_PORT:-9099}/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  xl1_data:
